name: Build HNStudio Musik AI Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify project structure
        shell: pwsh
        run: |
          Write-Host "Checking project structure..."

          if (!(Test-Path "CMakeLists.txt")) {
            Write-Error "CMakeLists.txt not found in repository root."
            exit 1
          }

          if (!(Test-Path "Source")) {
            Write-Error "Source folder not found."
            exit 1
          }

          Write-Host "Project structure OK."

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: |
          cmake --build build `
            --config Release `
            --parallel

      - name: Find EXE
        shell: pwsh
        run: |
          Write-Host "Searching for EXE..."

          $exe = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse |
                 Where-Object { $_.Name -notmatch "uninstall" } |
                 Select-Object -First 1

          if ($null -eq $exe) {
            Write-Error "No EXE file was generated."
            Get-ChildItem -Path "build" -Recurse | Select-Object FullName
            exit 1
          }

          Write-Host "Found EXE:"
          Write-Host $exe.FullName

          New-Item -ItemType Directory -Force -Path "package" | Out-Null

          Copy-Item $exe.FullName "package\HNStudio-Musik-AI.exe"

      - name: Copy Assets
        shell: pwsh
        run: |
          if (Test-Path "Assets") {
            Copy-Item "Assets" "package\Assets" -Recurse -Force
          }

          if (Test-Path "README.md") {
            Copy-Item "README.md" "package\README.md" -Force
          }

      - name: Create ZIP package
        shell: pwsh
        run: |
          if (Test-Path "HNStudio-Musik-AI-Windows-x64.zip") {
            Remove-Item "HNStudio-Musik-AI-Windows-x64.zip" -Force
          }

          Compress-Archive `
            -Path "package\*" `
            -DestinationPath "HNStudio-Musik-AI-Windows-x64.zip" `
            -CompressionLevel Optimal

          Write-Host "Package created:"
          Get-Item "HNStudio-Musik-AI-Windows-x64.zip"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HNStudio-Musik-AI-Windows-x64
          path: HNStudio-Musik-AI-Windows-x64.zip
          if-no-files-found: error
